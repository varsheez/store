name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 0 */3 * *' # Jalan setiap 3 hari sekali
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/promo_settings?select=count" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
